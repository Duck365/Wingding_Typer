<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingding Typer</title>
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Anton&family=Atomic+Age&family=Audiowide&family=Average&family=Permanent+Marker&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="screen-1" class="screen active">
        <div class="menu-container">
            <h1 id="glitch-title" class="glitch-title">WINGDING TYPER</h1>
            <button class="main-btn" onclick="goToScreen2()">+ Create new Wingding_typer document</button>
        </div>
    </div>

    <div id="screen-2" class="screen">
        <div class="menu-container">
            <button class="back-btn-menu" onclick="goToScreen1()">⬅ Back</button>
            <p class="menu-prompt">What form of wingdings do you want to type in?</p>
            <button class="main-btn" onclick="goToEditor('Wingdings')">Standard Wingdings</button>
            <button class="main-btn" onclick="goToEditor('Simple Uni-Shapes')">Simple Uni-Shapes</button>
        </div>
    </div>

    <div id="screen-3" class="screen editor-screen">
        
        <div class="top-toolbar">
            <div class="toolbar-left">
                <button class="toolbar-btn back-btn-editor" onclick="goToScreen1()">⬅ Menu</button>
            </div>
            <div class="toolbar-center">
                <select id="font-selector" class="font-dropdown" onchange="applyFont()">
                    <option value="Wingdings">Standard Wingdings</option>
                    <option value="Simple Uni-Shapes">Simple Uni-Shapes</option>
                    <option value="Arial">Arial</option>
                    <option value="Comic Sans MS">Comic Sans MS</option>
                    <option value="Atomic Age">Atomic Age</option>
                    <option value="Audiowide">Audiowide</option>
                    <option value="Aldrich">Aldrich</option>
                    <option value="Anton">Anton</option>
                    <option value="Average">Average</option>
                    <option value="'Permanent Marker'">Permanent Marker</option>
                    <option value="'Press Start 2P'">Press Start 2P</option>
                </select>
            </div>
            <div class="toolbar-right">
                <button class="toolbar-btn" onclick="openImportExportModal()">📤 Import/Export</button>
            </div>
        </div>

        <div class="tab-bar">
            <div class="tabs-list" id="tabs-list"></div>
            <button class="add-tab-btn" onclick="addTab()" title="Add new tab">+</button>
        </div>

        <div class="editor-background">
            <div id="editor-content" class="document-page" contenteditable="true" spellcheck="false" placeholder="Start typing..."></div>
        </div>
    </div>

    <div id="import-export-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeImportExportModal()">&times;</button>
            <h2>Import/Export Document</h2>
            <div class="modal-section">
                <h3>Export As:</h3>
                <div class="button-group">
                    <button class="modal-btn" onclick="downloadAs('json')">📥 JSON</button>
                    <button class="modal-btn" onclick="downloadAs('txt')">📥 Text</button>
                    <button class="modal-btn" onclick="downloadAs('pdf')">📥 PDF</button>
                    <button class="modal-btn" onclick="downloadAs('docx')">📥 Word (.docx)</button>
                </div>
            </div>
            <div class="modal-section">
                <h3>Import From:</h3>
                <input type="file" id="import-file" accept=".json,.txt" style="display: none;">
                <button class="modal-btn" onclick="document.getElementById('import-file').click()">📤 Choose File</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
    
    <script src="languages.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
